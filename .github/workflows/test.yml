on: [push, pull_request]

name: test
jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Install Go
        uses: actions/setup-go@v3
        with:
          go-version: 1.19

      - name: Build
        run: go build -v ./...

      - name: Lint
        run: go vet ./...

      - name: Create database
        run: |
          docker compose up -d db-test
          docker compose exec -T db-test sh -c 'until mysqladmin ping -h localhost -uroot -ppassword --silent; do sleep 1; done'

      - name: Test
        run: make test
